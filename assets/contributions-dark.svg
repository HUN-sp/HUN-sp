<svg xmlns="http://www.w3.org/2000/svg" width="840" height="392" viewBox="0 0 840 392" role="img" aria-label="21 merged pull requests to 9 repositories I don't own">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  </defs>
  <style>
    text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#c9d1d9}
    .h{font-size:20px;font-weight:700;fill:#e6edf3}
    .sub{font-size:13px;fill:#8b949e}
