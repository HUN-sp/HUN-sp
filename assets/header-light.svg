<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Vinay Kumar Chopra, AI engineer. I build grounded, evaluation-first AI systems.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#64748b" stroke-opacity=".08"/></pattern>
    <clipPath id="clip"><rect width="1200" height="360" rx="18"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .eyebrow{font:600 16px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.18em;fill:#64748b}
    .name{font-size:62px;font-weight:800;fill:#0f172a;letter-spacing:-.02em}
    .tag{font-size:30px;font-weight:500;fill:#334155}
    .grad{fill:url(#g);font-weight:700}
    .meta{font-size:18px;fill:#64748b}
    .cv{font-size:23px;font-weight:700;fill:#0f172a}
    .cl{font-size:16px;fill:#64748b}
    .w{opacity:0;animation:cycle 9s infinite}
    .w1{animation-delay:3s}.w2{animation-delay:6s}
    @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-8px)}}
    .o1{animation:drift1 14s ease-in-out infinite alternate}
    .o2{animation:drift2 18s ease-in-out infinite alternate}
    @keyframes drift1{to{transform:translate(120px,40px)}}
    @keyframes drift2{to{transform:translate(-140px,-30px)}}
    .card{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .line{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1.2s .2s ease forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.w,.o1,.o2,.card,.line,.cursor{animation:none}.w0,.card{opacity:1}.line{stroke-dashoffset:0}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle class="o1" cx="260" cy="80" r="170" fill="#7c3aed" fill-opacity="0.3" filter="url(#blur)"/>
    <circle class="o2" cx="980" cy="300" r="190" fill="#06b6d4" fill-opacity="0.3" filter="url(#blur)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="18" fill="none" stroke="#64748b" stroke-opacity=".25"/>
  <text x="60" y="96" class="eyebrow">&gt; AI ENGINEER · OPEN SOURCE · BITS PILANI<tspan class="cursor">_</tspan></text>
  <text x="58" y="170" class="name">Vinay Kumar Chopra</text>
  <line x1="60" x2="300" y1="192" y2="192" stroke="url(#g)" stroke-width="4" stroke-linecap="round" class="line"/>
  
    <text x="60" y="238" class="tag w w0">I build <tspan class="grad">grounded</tspan> AI systems.</text>
    <text x="60" y="238" class="tag w w1">I build <tspan class="grad">evaluation-first</tspan> AI systems.</text>
    <text x="60" y="238" class="tag w w2">I build <tspan class="grad">measured</tspan> AI systems.</text>
  <text x="60" y="294" class="meta">RAG · agents · evals  —  every claim links to where you can check it.</text>
  
  <g class="card" style="animation-delay:0.3s">
    <rect x="770" y="52" width="380" height="80" rx="14" fill="#ffffff" fill-opacity="0.85" stroke="#0f172a" stroke-opacity="0.08"/>
    <rect x="770" y="70" width="4" height="40" rx="2" fill="url(#g)"/>
    <text x="794" y="87" class="cv">5 merged PRs</text>
    <text x="794" y="113" class="cl">GRASS GIS · up to ~4.7× speedup</text>
  </g>
  <g class="card" style="animation-delay:0.44999999999999996s">
    <rect x="770" y="144" width="380" height="80" rx="14" fill="#ffffff" fill-opacity="0.85" stroke="#0f172a" stroke-opacity="0.08"/>
    <rect x="770" y="162" width="4" height="40" rx="2" fill="url(#g)"/>
    <text x="794" y="179" class="cv">Finalist</text>
    <text x="794" y="205" class="cl">Meta PyTorch × OpenEnv Hackathon</text>
  </g>
  <g class="card" style="animation-delay:0.6s">
    <rect x="770" y="236" width="380" height="80" rx="14" fill="#ffffff" fill-opacity="0.85" stroke="#0f172a" stroke-opacity="0.08"/>
    <rect x="770" y="254" width="4" height="40" rx="2" fill="url(#g)"/>
    <text x="794" y="271" class="cv">AI Eng. Intern</text>
    <text x="794" y="297" class="cl">Thriftstone · Jul – Oct 2026</text>
  </g>
</svg>
